<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eğlence Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&family=Cinzel:wght@700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
        }

        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .game-card:hover {
            transform: translateY(-5px);
        }

        .jump-font {
            font-family: 'Press Start 2P', cursive;
        }

        .tarot-font {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-4xl p-6 flex flex-col items-center">
        
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-4 tracking-tight">Oyun Seçimi</h1>
            <p class="text-slate-500 text-lg">Bugün ne oynamak istersin?</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-2xl">
            
            <!-- Yukarı Zıpla Card -->
            <a href="jump.html" class="game-card group relative flex flex-col items-center p-8 bg-white rounded-3xl shadow-xl shadow-sky-100 border border-sky-50 overflow-hidden text-decoration-none">
                <div class="absolute inset-0 bg-gradient-to-br from-sky-400 to-blue-500 opacity-0 group-hover:opacity-10 transition-opacity"></div>
                
                <div class="w-20 h-20 bg-sky-100 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner group-hover:scale-110 transition-transform">
                    👾
                </div>
                
                <h2 class="text-2xl font-bold text-sky-900 mb-3 jump-font text-center text-sm md:text-base leading-relaxed">Yukarı Zıpla</h2>
                <p class="text-slate-500 text-center text-sm">
                    Sonsuz bir maceraya atıl! Zıpla, engelleri aş ve ne kadar yükseğe çıkabileceğini göster.
                </p>
                
                <div class="mt-8 px-6 py-2 bg-sky-50 text-sky-600 font-semibold rounded-full group-hover:bg-sky-500 group-hover:text-white transition-colors">
                    Oyna ➔
                </div>
            </a>

            <!-- Günün Şans Kartı Card -->
            <a href="tarot.html" class="game-card group relative flex flex-col items-center p-8 bg-white rounded-3xl shadow-xl shadow-indigo-100 border border-indigo-50 overflow-hidden text-decoration-none">
                <div class="absolute inset-0 bg-gradient-to-br from-purple-600 to-indigo-800 opacity-0 group-hover:opacity-10 transition-opacity"></div>
                
                <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner group-hover:scale-110 transition-transform">
                    🔮
                </div>
                
                <h2 class="text-2xl font-bold text-indigo-900 mb-3 tarot-font text-center">Günün Şans Kartı</h2>
                <p class="text-slate-500 text-center text-sm">
                    Geleceğin sana ne fısıldıyor? Gizemli kartlardan birini seç ve kaderinle yüzleş.
                </p>
                
                <div class="mt-8 px-6 py-2 bg-indigo-50 text-indigo-600 font-semibold rounded-full group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    Kart Seç ➔
                </div>
            </a>

        </div>

    </div>

</body>
</html>
